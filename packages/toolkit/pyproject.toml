[project]
name = "genomeclaw-toolkit"
version = "0.0.1"
description = "GenomeClaw host-side bioinformatics toolkit (CLI + service)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "GenomeClaw contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Private :: Do Not Upload",
]
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.15",
    "rich>=13.0,<15",
    # Pin click <8.3 until typer supports the new Parameter.make_metavar
    # signature. Track https://github.com/fastapi/typer/issues for the
    # upgrade path.
    "click>=8.0,<8.3",
    # Phase 5: host service.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # FastAPI's TestClient transitively depends on httpx; pin explicitly so
    # the integration tests can construct test clients without an extra
    # dev-only dependency declaration.
    "httpx>=0.27",
    # zstandard decompression for `pgs_catalog_ancestry` fetch post-hook —
    # PGS Catalog ships the HGDP+1KG ancestry reference bundle as
    # ``.tar.zst``. Streaming-decompress via ``ZstdDecompressor.stream_reader``
    # avoids holding the multi-GB tarball in memory and avoids needing a
    # ``zstd`` system binary in the toolkit image.
    "zstandard>=0.22",
]

[project.scripts]
genomeclaw = "genomeclaw_toolkit._cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpserver>=1.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genomeclaw_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "needs_bio: requires real bcftools / mosdepth / samtools — runs inside the genomeclaw/toolkit image, skipped on the bare host venv unless GENOMECLAW_HAS_BIO=1.",
    "needs_sandbox: requires a built nemoclaw-plugin sandbox image — skipped unless GENOMECLAW_SANDBOX_IMAGE points at a docker-pullable tag.",
    "needs_prs_runtime: requires a toolkit image carrying the PRS runtime stack (Nextflow + JRE 17 + mamba + pre-warmed pgsc_calc source). Skipped unless GENOMECLAW_TOOLKIT_PRS_IMAGE points at a docker-pullable tag AND `docker` is on PATH.",
    "needs_phase5_smoke_artifacts: requires GENOMECLAW_PHASE5_SMOKE_DIR pointing at a directory produced by `bin/genomeclaw-prs-smoke`. Tests in this marker verify the recorded smoke artifacts; they auto-skip without the env var so CI stays green without a real smoke run.",
    "needs_prod_python: runs a probe inside the toolkit image via `docker run` to catch dev/prod Python version skew. Gated by GENOMECLAW_TOOLKIT_PRS_IMAGE pointing at a built image + `docker` on PATH. Closes the Phase 3 misstep where a Python-3.13-only `Path` subclass form survived to smoke-time (toolkit image runs Python 3.11).",
    "live_llm: makes a real (paid) LLM call through the gateway in the sandbox image — skipped unless OPENAI_API_KEY AND GENOMECLAW_SANDBOX_IMAGE are both set. Each test costs one real OpenAI call; use sparingly.",
    "live_ssrf_probe: spawns the sandbox image and issues outbound HTTP from the policy-allowlisted Node runtime to assert the OpenShell L7 policy denies un-allowlisted (host, port, method, path) tuples. Runs the explicit-runtime-negative-case layer for INV-P002. Skipped unless GENOMECLAW_HAS_DOCKER=1 AND GENOMECLAW_SANDBOX_IMAGE is set. No LLM calls — gateway + Node only.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Strict rule set (per rich-cli plan § Quality Bar). New code under `_cli/`
# adopts the full set; legacy `prep/` is opt-out via per-file-ignores until
# each phase migrates its modules.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "N",    # naming conventions
    "D",    # pydocstyle
    "RET",  # return statement consistency
    "SIM",  # simplification
    "ARG",  # unused arguments
    "PTH",  # pathlib over os.path
    "TCH",  # type-checking imports
    "PERF", # performance hints
    "RUF",  # ruff-specific
    "C4",   # comprehensions
    "PIE",  # misc
    "PT",   # pytest style
    "S",    # bandit security
    "ANN",  # annotation completeness
]
ignore = [
    "D203",   # one-blank-line-before-class — conflicts with D211
    "D213",   # multi-line-summary-second-line — conflicts with D212
    "ANN401", # disallow Any — too aggressive; mypy strict catches the real cases
    "S603",   # subprocess-without-shell-equals-true — false-positive heavy
    "S607",   # start-process-with-partial-path — we deliberately rely on $PATH for vcfanno/bcftools
    "PT011",  # broad pytest.raises — fine for our test style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: relaxed docstring + annotation + security rules. Tests aren't
# a stable API surface; the strict bars apply to production code only.
"tests/**" = [
    "D", "ANN", "S", "PT", "ARG", "PERF", "SIM", "RUF", "TC", "PTH", "N",
    "PIE", "UP", "E501", "C4", "RET",
]
# Legacy `prep/` modules: migrated phase-by-phase as their callers
# move. As each phase touches a prep/ module, the module gets removed
# from this ignore list and the strict bars apply.
"src/genomeclaw_toolkit/prep/**" = [
    "D", "ANN", "ARG", "PERF", "SIM", "N", "PT", "PTH", "TC", "RUF", "S", "PIE", "UP", "E501",
    "RET",
]
# Carve-out: new ``prep/`` modules added during the rich-cli migration
# (or later) get the full strict rule set — the per-module override here
# negates the legacy-friendly ignores above. The list grows as each
# phase touches more legacy modules.
"src/genomeclaw_toolkit/prep/_bgzip.py" = []
"src/genomeclaw_toolkit/prep/runs.py" = []
"src/genomeclaw_toolkit/prep/references.py" = []
# rich-cli Phase 5 graduations — the four orchestrators touched for
# `progress_callback` plumbing. Their legacy bodies passed the strict
# rule set as written; graduation just removes the safety carve-out.
"src/genomeclaw_toolkit/prep/ingest.py" = []
"src/genomeclaw_toolkit/prep/normalize.py" = []
"src/genomeclaw_toolkit/prep/annotate.py" = []
"src/genomeclaw_toolkit/prep/materialize.py" = []
"src/genomeclaw_toolkit/schemas/**" = ["D", "ANN", "TC"]
# Top-level package init shim — too small to docstring meaningfully.
"src/genomeclaw_toolkit/__init__.py" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/genomeclaw_toolkit/_cli"]
# Third-party libs without inline type info:
[[tool.mypy.overrides]]
module = ["duckdb.*", "pytest_httpserver.*", "yaml.*"]
ignore_missing_imports = true
